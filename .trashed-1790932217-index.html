<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Counter App</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 85%;
            max-width: 400px;
            padding: 30px 20px;
            background: white;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        #count {
            font-size: 70px;
            font-weight: bold;
            color: #667eea;
            margin: 25px;
        }

        button {
            padding: 15px 20px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        .reset {
            background: #e74c3c;
        }

    </style>
</head>

<body>

    <div class="app">

        <h1>My Counter App 🔢</h1>

        <div id="count">0</div>

        <button id="increaseButton">Increase +</button>

        <button id="resetButton" class="reset">Reset</button>

    </div>


    <script>

        let count = 0;

        const countDisplay =
            document.getElementById("count");

        const increaseButton =
            document.getElementById("increaseButton");

        const resetButton =
            document.getElementById("resetButton");


        increaseButton.addEventListener("click", function () {

            count++;

            countDisplay.innerText = count;

        });


        resetButton.addEventListener("click", function () {

            count = 0;

            countDisplay.innerText = count;

        });

    </script>

</body>

</html>
